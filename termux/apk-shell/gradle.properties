android.useAndroidX=true
org.gradle.jvmargs=-Xmx1536m
android.overridePathCheck=true

# ── 版本单源 ─────────────────────────────────────────────
# APK 壳的版本号必须与 agentd（agentd/main.py 的 VERSION）保持一致，
# 否则用户无法判断手机上装的是哪一版。由 tests/check_version.py 在门禁里校验。
# 改版本时三处一起改：这里、agentd/main.py、agentd/web/package.json。
POCKET_VERSION_NAME=1.6.0
POCKET_VERSION_CODE=160
