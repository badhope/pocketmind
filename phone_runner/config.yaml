# MobiAgent phone_runner 配置文件
# 模型注册表和自动选择规则

# 默认模型(用最小的)
default_model: "minicpm-v-4.6"

# llama-server 配置
server:
  port: 8080
  host: "127.0.0.1"
  ctx_size: 4096
  n_gpu_layers: 0        # Termux 用 CPU
  n_threads: null         # null = 自动检测
  startup_timeout: 60     # 启动超时(秒)

# 模型注册表(已联网验证 2026-06)
models:
  minicpm-v-4.6:
    name: "MiniCPM-V 4.6"
    repo: "openbmb/MiniCPM-V-4.6-gguf"
    files:
      model: "MiniCPM-V-4.6-Q4_K_M.gguf"
      mmproj: "mmproj-MiniCPM-V-4.6-F16.gguf"
    size_gb: 1.3
    ram_gb: 4
    license: "Apache-2.0"
    source: "huggingface"
    is_vision: true
    description: "面壁智能+清华,Qwen3.5-0.8B+SigLIP2,1.3B 同尺寸 SOTA,4GB RAM"

  qwen3.5-0.8b:
    name: "Qwen3.5-0.8B"
    repo: "unsloth/Qwen3.5-0.8B-GGUF"
    files:
      model: "Qwen3.5-0.8B-UD-Q4_K_XL.gguf"
      mmproj: "mmproj-BF16.gguf"
    size_gb: 0.6
    ram_gb: 3
    license: "Apache-2.0"
    source: "huggingface"
    is_vision: true
    description: "Qwen3.5 最小尺寸,原生多模态,3GB RAM 极致小"

  qwen3.5-2b:
    name: "Qwen3.5-2B"
    repo: "unsloth/Qwen3.5-2B-GGUF"
    files:
      model: "Qwen3.5-2B-UD-Q4_K_XL.gguf"
      mmproj: "mmproj-BF16.gguf"
    size_gb: 1.5
    ram_gb: 4
    license: "Apache-2.0"
    source: "huggingface"
    is_vision: true
    description: "Qwen3.5 原生多模态(图+视频+文本),4GB RAM"

  qwen3.5-4b:
    name: "Qwen3.5-4B"
    repo: "unsloth/Qwen3.5-4B-GGUF"
    files:
      model: "Qwen3.5-4B-UD-Q4_K_XL.gguf"
      mmproj: "mmproj-BF16.gguf"
    size_gb: 2.5
    ram_gb: 6
    license: "Apache-2.0"
    source: "huggingface"
    is_vision: true
    description: "Qwen3.5 原生多模态,Unsloth 动态量化,6GB RAM"

  gui-owl-7b:
    name: "GUI-Owl-7B (需自转GGUF)"
    repo: "mPLUG/GUI-Owl-7B"
    files:
      model: "GUI-Owl-7B-Q4_K_M.gguf"
      mmproj: "mmproj-F16.gguf"
    size_gb: 5.0
    ram_gb: 10
    license: "MIT"
    source: "huggingface"
    is_vision: true
    description: "通义 GUI-Owl,GUI 自动化 SOTA,需用 convert_hf_to_gguf.py 自行转换"
    note: "此模型无官方GGUF,需从safetensors自行转换"

# 自动选择规则(按 RAM)
auto_select:
  ram_3gb: "qwen3.5-0.8b"
  ram_4gb: "minicpm-v-4.6"
  ram_6gb: "qwen3.5-4b"
  ram_10gb: "gui-owl-7b"

# Agent 配置
agent:
  max_steps: 35
  screenshot_format: "JPEG"
  screenshot_quality: 85
  step_delay: 1.0          # 每步间隔(秒)
  inference_timeout: 180   # 推理超时(秒)

# 模型下载镜像(国内加速)
mirrors:
  huggingface: "https://huggingface.co"
  hf_mirror: "https://hf-mirror.com"
  modelscope: "https://www.modelscope.cn"
