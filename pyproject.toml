[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["agentd/web", "tests/setup_faketermux.sh"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]
ignore = [
    "E501",  # 行宽由 formatter 控制，长 URL/JSON 不强制折行
    "B008",  # FastAPI 依赖注入中函数调用作为默认值是正常用法
    "UP007",  # 3.9 兼容期保留 X | Y 写法不强制
]

[tool.ruff.lint.per-file-ignores]
"agentd/mock_llm.py" = ["F821"]  # mock 中动态构造的命名空间
"tests/*.py" = ["E402", "F401"]  # 测试脚本允许 sys.path 操作和未使用导入
"agentd/tools/*.py" = ["ASYNC109"]  # 工具处理器的 timeout 是传给 subprocess 的同步参数，非 asyncio 超时

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
# pytest-asyncio 1.x 默认 strict 模式，async 测试需逐个加标记；
# 本仓库测试统一为 async 风格，用 auto 模式免去重复样板。
asyncio_mode = "auto"
testpaths = ["tests"]
# 默认只收集 test_*.py / *_test.py；eval_*.py 是 promptfoo 风格的评测脚本，也一并收集
python_files = ["test_*.py", "*_test.py", "eval_*.py"]

# mypy 渐进式基线：
#   - 目标 Python 3.11（与 CI / Termux 对齐）；
#   - ignore_missing_imports：三方库（mcp / python-telegram-bot）未提供完整类型；
#   - 当前剩余告警多为「模块级 store: Store|None 在 lifespan 后才赋值」的架构性收窄，
#     以及 mcp SDK 泛型 ClientSession 的已知不兼容，均非运行期 bug（P0/P1 已修）。
#   跑法：python -m mypy agentd/ --ignore-missing-imports
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true
check_untyped_defs = false
