name: CI

# 门禁的权威实现是 tests/run_all.sh，CI 只负责「装环境 + 调它」。
# 这样本地和 CI 跑的是同一份检查清单，不会出现两边套件数量、参数漂移
# （上一版 CI 就是因为列了一份静态套件名单、删掉工作流后无人维护而失效的）。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tests/run_all.sh --backend)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            agentd/requirements.txt
            agentd/requirements-dev.txt

      # 用锁文件装：CI 与本地跑的是同一棵依赖树，避免上游 patch 让门禁漂移。
      - name: Install dependencies (locked)
        run: |
          python -m pip install --upgrade pip
          pip install -r agentd/requirements-lock.txt -r agentd/requirements-dev-lock.txt

      - name: Run backend gate
        run: bash tests/run_all.sh --backend

  frontend:
    name: Frontend (typecheck + test + build + dist freshness)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: agentd/web/package-lock.json

      - name: Install dependencies
        working-directory: agentd/web
        run: npm ci

      - name: Run frontend gate
        run: bash tests/run_all.sh --frontend

  e2e:
    name: E2E (Playwright, manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agentd/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: agentd/web/package-lock.json

      - name: Install dependencies
        run: |
          pip install -r agentd/requirements.txt
          cd agentd/web && npm ci && npx playwright install --with-deps chromium

      - name: Run E2E
        run: bash tests/run_all.sh --with-e2e

  # Android APK：交付物必须由 CI 产出，而不是让用户自己装 Android Studio。
  # 审计 2026-10-29 发现仓库从未发布过 APK、且干净克隆 ./gradlew 不可用（wrapper jar 被
  # .gitignore 排除），这两个问题都让"能装到手机上"变成一句空话。
  android:
    name: Android APK (assembleDebug + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ubuntu-latest 自带 Android SDK（ANDROID_HOME 已指向 /usr/local/lib/android/sdk）。
      # 1.6.0 用的 android-actions/setup-android@v3 在该镜像上每次都红（16 个 run 无一例外），
      # 所以这里不再重装 SDK，只补齐本项目需要的 platform/build-tools 并接受许可证。
      - name: Install platform + build-tools (preinstalled SDK)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Unit tests (Robolectric)
        working-directory: termux/apk-shell
        run: bash ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Lint (fails on errors)
        run: bash scripts/build-apk.sh --lint

      - name: Build + verify debug APK
        run: bash scripts/build-apk.sh

      - name: Build release APK (unsigned without keystore)
        run: bash scripts/build-apk.sh --release

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pocketmind-android-apk
          path: |
            termux/apk-shell/app/build/outputs/apk/debug/app-debug.apk
            termux/apk-shell/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
